server:
  port: 8080

spring:
  application:
    name: library-management-system
  profiles:
    active: local
  sql:
    init:
      mode: always
      continue-on-error: true
  datasource:
    url: jdbc:mysql://localhost:3306/library_management_system?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.team.lms.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

alipay:
  sandbox:
    app-id: ${ALIPAY_SANDBOX_APP_ID:}
    merchant-private-key: ${ALIPAY_SANDBOX_MERCHANT_PRIVATE_KEY:}
    alipay-public-key: ${ALIPAY_SANDBOX_ALIPAY_PUBLIC_KEY:}
    gateway-url: ${ALIPAY_SANDBOX_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
    notify-base-url: ${ALIPAY_SANDBOX_NOTIFY_BASE_URL:}
    return-url: ${ALIPAY_SANDBOX_RETURN_URL:http://127.0.0.1:5173/reader/fines}
    connect-timeout-ms: ${ALIPAY_SANDBOX_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${ALIPAY_SANDBOX_READ_TIMEOUT_MS:60000}
